[package]
name = "mcpherd"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Keep MCP servers in check across coding agent sessions (Claude Code, Codex, Cursor)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rorogogogo/mcpherd"
readme = "README.md"
keywords = ["mcp", "claude-code", "codex", "cli", "proxy"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-*"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sysinfo = "0.40.1"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "process", "sync", "time", "macros"] }
toml = "1.1.8"
toml_edit = "0.25.19"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
